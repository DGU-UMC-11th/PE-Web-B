name: Assign issue author

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  assign-author:
    runs-on: ubuntu-latest

    steps:
      - name: Assign issue author
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          AUTHOR: ${{ github.event.issue.user.login }}
        run: |
          gh issue edit "$ISSUE_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --add-assignee "$AUTHOR"
